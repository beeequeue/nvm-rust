[package]
name = "nvm-rust"
version = "0.4.3"
description = "A node version manager that doesn't suck"
authors = ["BeeeQueue <adam@haglund.dev>"]
repository = "https://github.com/BeeeQueue/nvm-rust"
homepage = "https://github.com/BeeeQueue/nvm-rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["node", "version", "manager", "nvm"]
categories = ["command-line-utilities"]
edition = "2021"

exclude = [
  ".github/",
  "tests/",
  "test-data/",
]

[profile.release]
strip = true
lto = true

[[bin]]
name = "nvm"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env", "cargo"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
itertools = "0.14.0"
node-semver = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ureq = { version = "3.1.2", features = ["native-tls", "json"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1.1.4"
tar = "0.4.44"

[target.'cfg(windows)'.dependencies]
zip = "6.0.0"

[dev-dependencies]
assert_cmd = "2.0.17"
assert_fs = "1.1.3"
predicates = "3.1.3"
speculoos = "0.13.0"
